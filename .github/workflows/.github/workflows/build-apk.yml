name: Build Nüans Mebel APK
# Android APK build workflow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository-ni götür
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android layihəsini aç
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          mkdir project
          unzip -q "$ZIP" -d project
          cd project

          if [ -d "app" ]; then
            echo "Layihə tapıldı"
          else
            echo "Android layihəsi tapılmadı"
            exit 1
          fi

      - name: Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: APK hazırla
        run: |
          cd project
          gradle assembleDebug --no-daemon

      - name: APK-ni saxla
        uses: actions/upload-artifact@v4
        with:
          name: Nuans-Mebel-Salyan-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
